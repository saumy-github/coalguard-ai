services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src  # Hot-reloads code inside Docker!
      - ./backend/scripts:/app/scripts
      - ./uploads:/app/uploads  # Root-level uploads/ folder, host-visible and persistent
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - chromadb

  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_dev_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - chroma_dev_data:/chroma/chroma
    restart: unless-stopped

  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./ai_engine/.env
    volumes:
      - ./ai_engine/src:/app/src
      - ./ai_engine/data:/app/data
      - ./ai_engine/train_cv.py:/app/train_cv.py
      - ./ai_engine/ingest_rag.py:/app/ingest_rag.py
      - ./uploads:/app/uploads  # for reading registered_faces/
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # Offline EVM chain (chain_id 31337) for developing and demoing the whole
  # anchoring flow with no faucet, no RPC provider and no internet. Started
  # only on request via `npm run chain:node` (profile: chain), so the normal
  # `dev:up` never pays for it. Node is pinned to 20 because Hardhat 2 hangs
  # silently on newer Node — same reason the chain:* scripts containerise it.
  hardhat:
    image: node:20
    profiles: ["chain"]
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"
    restart: unless-stopped

  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8003:8000"
    env_file:
      - ./blockchain/.env
    volumes:
      - ./blockchain/src:/app/src  # Hot-reloads code inside Docker!
      - ./blockchain/abi:/app/abi
      - ./blockchain/deployments:/app/deployments
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    depends_on:
      - mongodb

volumes:
  mongo_dev_data:
  redis_dev_data:
  chroma_dev_data:
