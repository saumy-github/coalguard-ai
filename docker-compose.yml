services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src  # Hot-reloads code inside Docker!
      - ./backend/scripts:/app/scripts
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - chromadb

  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_dev_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - chroma_dev_data:/chroma/chroma
    restart: unless-stopped

  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./ai_engine/.env
    volumes:
      - ./ai_engine/src:/app/src
      - ./ai_engine/data:/app/data
      - ./ai_engine/train_cv.py:/app/train_cv.py
      - ./ai_engine/ingest_rag.py:/app/ingest_rag.py
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  mongo_dev_data:
  redis_dev_data:
  chroma_dev_data:
