[pytest]
testpaths = tests
# web3 registers a pytest plugin (web3.tools.pytest_ethereum) via a setuptools
# entry point purely by being installed — nothing here uses it. Its own import
# crashes against the eth_typing version pip otherwise resolves (ContractName
# was removed/renamed upstream). `-p no:<name>` can't fix this: pytest applies
# that AFTER entry-point autoload has already tried (and crashed) importing
# every registered plugin, so the failure happens before "-p no:" ever gets a
# chance to act. The actual fix is PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 as an env
# var on the pytest invocation itself (see requirements-dev.txt / package.json
# chain:pytest) — this file just documents why.
